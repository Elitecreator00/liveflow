# nginx-rtmp — Target 1 (simula piattaforma A, es. Twitch)
# Riceve il flusso fan-out da MediaMTX via RTMP
# Espone HLS su porta 80 per verifica browser

worker_processes 1;
error_log /dev/stdout warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Abilita HLS per verifica browser
            hls on;
            hls_path /tmp/hls-target1;
            hls_fragment 2s;
            hls_playlist_length 10s;

            # Log connessioni
            on_publish http://localhost/on_publish;
            notify_method get;
        }
    }
}

http {
    access_log /dev/stdout;

    server {
        listen 80;

        # Stat nginx-rtmp (JSON/XML con connessioni attive)
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        # Endpoint HLS per verifica browser
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t              ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Health check semplice
        location /health {
            return 200 '{"status":"ok","target":"1","service":"dummy-rtmp-1"}';
            add_header Content-Type application/json;
        }

        # Stub on_publish (accetta sempre)
        location /on_publish {
            return 200;
        }
    }
}
