# LiveKit Egress — config dev (worker in container).
# L'Egress è un worker: si registra su Redis, riceve i job da LiveKit, lancia
# Chrome headless per caricare la pagina-scena, registra e fa push RTMP.
#
# Gira in un container Linux: per raggiungere i servizi sull'host Windows usa
# host.docker.internal (Redis dev, LiveKit nativo, console, MediaMTX).
redis:
  address: host.docker.internal:6380
api_key: devkey
api_secret: secret
ws_url: ws://host.docker.internal:7880
# Necessario per Chrome headless dentro il container.
insecure: true
logging:
  level: info
